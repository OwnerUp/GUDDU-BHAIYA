<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#071629,#123a60);
 font-family:Arial,sans-serif;
 color:white;
 text-align:center;
 padding:20px;
}
.card{
 width:100%;
 max-width:420px;
 padding:32px 22px;
 border-radius:24px;
 background:#ffffff12;
 border:1px solid #ffffff30;
 box-shadow:0 15px 45px #0005;
}
.dp{
 width:135px;
 height:135px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid #29b6ff;
 animation:pop .8s ease both;
}
h1{font-size:30px;margin:20px 0 8px}
p{color:#d4e6f5;line-height:1.6}
.features{margin:24px 0}
.features span{
 display:inline-block;
 background:#ffffff18;
 padding:10px;
 border-radius:10px;
 margin:4px;
 font-size:13px;
}
.join{
 display:block;
 padding:18px 15px;
 border-radius:14px;
 background:#0088cc;
 color:white;
 font-size:20px;
 font-weight:bold;
 text-decoration:none;
 animation:pulse 2s infinite;
}
.small{font-size:12px;margin-top:20px}
@keyframes pop{
 0%{transform:scale(.5);opacity:0}
 75%{transform:scale(1.08)}
 100%{transform:scale(1);opacity:1}
}
@keyframes pulse{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.035)}
}
@media(prefers-reduced-motion:reduce){
 .dp,.join{animation:none}
}
</style>
</head>

<body>
<main class="card">
<img class="dp" src="dp.jpg" alt="Channel profile photo">

<h1>GUDDU BHAIYA</h1>
<p>Cricket News, Match Updates & Sports Insights</p>

<div class="features">
<span>🏏 Match Updates</span>
<span>📢 Cricket News</span>
<span>📊 Match Analysis</span>
</div>

<a class="join"
   id="telegramJoin"
   href="PASTE_YOUR_TELEGRAM_LINK_HERE">
   Join Telegram Channel
</a>

<p class="small">
Independent cricket information channel.
</p>
</main>

<script>
document.getElementById('telegramJoin')
.addEventListener('click',function(e){
  const url=this.href;

  if(url.includes('PASTE_YOUR_TELEGRAM_LINK_HERE')){
    e.preventDefault();
    alert('Please configure Telegram link');
    return;
  }

  e.preventDefault();

  if(typeof fbq==='function'){
    fbq('trackCustom','TelegramJoinClick',{
      channel:'Guddu Bhaiya',
      action:'telegram_button_click'
    });
  }

  setTimeout(function(){
    window.location.href=url;
  },900);
});
</script>
</body>
</html>
